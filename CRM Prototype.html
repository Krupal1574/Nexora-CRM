<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nexora CRM – Prototype</title>
<style>
:root{--navy:#1A1A1C;--navy2:#2c2c30;--bl:#1F6FEB;--or:#F58220;--bg:#FAF5E9;--card:#FFFCF4;--tx:#1A1A1C;--mu:#6f6a5e;--bd:#E8DFCB;--ok:#1f9d6b;--bad:#d64545;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121214;--card:#1d1d20;--tx:#F3EEE2;--mu:#a29d92;--bd:#34343a}}
:root[data-theme="dark"]{--bg:#121214;--card:#1d1d20;--tx:#F3EEE2;--mu:#a29d92;--bd:#34343a}
*{box-sizing:border-box}html,body{margin:0}body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--navy);color:#cfd8e8;padding:16px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;transition:.2s}
.logo{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px;padding:4px 8px 18px}
.logo i{width:32px;height:32px;border-radius:9px;background:var(--or);display:grid;place-items:center;font-style:normal;color:#fff}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#cfd8e8;text-decoration:none;cursor:pointer;margin-bottom:2px}
.nav a:hover{background:var(--navy2)}.logo{border-bottom:1px solid #2c2c30;margin-bottom:12px}.nav a.on{background:var(--or);color:#fff;font-weight:600}
.nav small{margin:14px 10px 6px;display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#7f90ad}
main{flex:1;min-width:0}
header{display:flex;gap:12px;align-items:center;padding:12px 24px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5}
header input{flex:1;max-width:420px}
.burger{display:none}
.wrap{padding:24px;max-width:1280px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px}
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpi{border-top:3px solid var(--bl)}.kpi:nth-child(2n){border-top-color:var(--or)}.kpi b{font-size:26px;display:block;margin-top:4px}.kpi span{color:var(--mu);font-size:12px}.up{color:var(--ok);font-size:12px;font-weight:600}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--or);outline-offset:1px}
.btn{background:var(--or);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}.btn.navy{background:var(--navy);color:#fff}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}.tools input,.tools select{width:auto;min-width:160px}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:620px}th{text-align:left;font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
th,td{padding:11px 10px;border-bottom:1px solid var(--bd)}tr:last-child td{border:0}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:600;background:#dce8ff;color:#1550b8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill{background:#1c2c4d;color:#a9c8ff}}
:root[data-theme="dark"] .pill{background:#1c2c4d;color:#a9c8ff}
.pill.or{background:#fde9d6;color:#b25400}.pill.ok{background:#d9f3e8;color:#14704b}.pill.bad{background:#fbe0e0;color:#a52a2a}
.soon{font-size:10px;background:#fde9d6;color:#b25400;border-radius:6px;padding:2px 6px;margin-left:6px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.av{width:30px;height:30px;border-radius:50%;background:var(--bl);color:#fff;display:inline-grid;place-items:center;font-size:12px;font-weight:700;vertical-align:middle;margin-right:8px}
.empty{text-align:center;padding:40px 16px;color:var(--mu)}.empty big{font-size:34px;display:block}.empty h3{color:var(--tx);margin:8px 0 4px}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:10px;min-height:260px}.col h4{margin:2px 4px 10px;display:flex;justify-content:space-between}
.col.over{border-color:var(--or)}.kc{background:var(--card);border:1px solid var(--bd);border-left:3px solid var(--or);border-radius:10px;padding:10px;margin-bottom:8px;cursor:grab}.kc small{color:var(--mu)}
.bar{height:8px;border-radius:9px;background:var(--bd);overflow:hidden}.bar i{display:block;height:100%;background:var(--bl)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.pv{display:flex;gap:14px;align-items:center}.pv .big{width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--bl),var(--or));color:#fff;display:grid;place-items:center;font-size:24px;font-weight:800;flex-shrink:0}
.note{border-left:3px solid var(--or)}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer}.sw input{width:auto}
#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(80px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:20;max-width:90vw}#toast.show{transform:translateX(-50%)}
.ro{opacity:.55;pointer-events:none}
@media(max-width:860px){aside{position:fixed;z-index:30;left:-260px;top:0;padding-top:calc(16px + env(safe-area-inset-top,0px))}aside.open{left:0}.burger{display:inline-block}.wrap{padding:16px}header{padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px))}}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.steps span{padding:6px 12px;border-radius:99px;background:var(--card);border:1px solid var(--bd);color:var(--mu);font-weight:600;font-size:13px}.steps .on{background:var(--or);border-color:var(--or);color:#fff}.steps .dn{background:var(--bl);border-color:var(--bl);color:#fff}.drop{display:block;text-align:center;padding:36px 16px;border:2px dashed var(--or);cursor:pointer}.tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--bd)}.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}.tabs .on{color:var(--tx);border-color:var(--or)}.chk{display:flex;align-items:center;gap:8px;padding:6px 0}.chk input{width:auto}
</style><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script></head><body>
<div class="app">
<aside id="side"><div class="logo"><i>N</i>Nexora CRM</div><nav class="nav" id="nav"></nav></aside>
<main><header><button class="btn ghost burger" onclick="side.classList.toggle('open')" aria-label="Menu">☰</button>
<input placeholder="Search leads, candidates, jobs… (coming soon)" onfocus="soon('Global search')">
<button class="btn ghost" onclick="toggleTheme()" title="Theme">◐</button><span class="av" style="margin:0">KP</span></header>
<div class="wrap" id="view"></div></main></div><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let EMPTY=false;
const D={
leads:[["Aarav Mehta","Brightline Tech","Referral","Warm","Priya S.","₹4.2L"],["Sofia Rossi","Helix Health","Website","Hot","Rahul K.","₹7.8L"],["Daniel Kim","Orbit Retail","Cold outreach","New","Priya S.","₹2.1L"],["Neha Patel","Zenith Logistics","Event","Warm","Amit D.","₹5.5L"],["Omar Haddad","Crestview Bank","Referral","Hot","Rahul K.","₹9.0L"]],
cands:[["Isha Verma","Senior React Developer","Ahmedabad","Interview","6 yrs"],["Marco Lopez","Data Analyst","Remote","Screening","3 yrs"],["Tanvi Shah","HR Business Partner","Mumbai","Offer","8 yrs"],["Liam Carter","DevOps Engineer","Pune","New","5 yrs"],["Anaya Roy","Product Designer","Remote","Placed","4 yrs"],["Vikram Joshi","Sales Manager","Surat","Screening","9 yrs"]],
clients:[["Brightline Tech","Technology","Active",4,"Meera N."],["Helix Health","Healthcare","Active",2,"Rahul K."],["Crestview Bank","Finance","Prospect",0,"Amit D."],["Orbit Retail","Retail","On hold",1,"Priya S."]],
jobs:[["Senior React Developer","Brightline Tech","Ahmedabad","Open",12],["Clinical Data Analyst","Helix Health","Remote","Open",7],["HR Business Partner","Orbit Retail","Mumbai","Offer stage",5],["DevOps Engineer","Brightline Tech","Pune","Open",9],["Relationship Manager","Crestview Bank","Surat","Draft",0]],
tasks:[["Call Sofia Rossi about Helix mandate","Today","High",0],["Send shortlist to Brightline","Today","High",0],["Update salary benchmarks","Tomorrow","Med",0],["Reference check – Tanvi Shah","Fri","Med",0],["Archive closed jobs","Next week","Low",1]],
notes:[["Isha Verma","Strong system-design skills; notice period 30 days. Prefers hybrid.","Priya S.","2h ago"],["Helix Health","Budget approved for 2 analysts in Q1. Decision maker: Dr. Rossi.","Rahul K.","Yesterday"],["Omar Haddad","Wants a quarterly hiring plan before signing.","Rahul K.","2 days ago"]],
team:[["Krupal P.","Owner / Admin","Full access"],["Priya S.","Senior Recruiter","Leads, candidates, jobs"],["Rahul K.","Account Manager","Clients, leads, jobs"],["Amit D.","Recruiter","Candidates, tasks"],["Meera N.","Viewer","Read-only"]],
log:[["Priya S.","moved Isha Verma to Interview","10 min ago"],["Rahul K.","added lead Omar Haddad","1 h ago"],["Krupal P.","changed role of Amit D. to Recruiter","3 h ago"],["Amit D.","completed task “Update salary benchmarks”","Yesterday"],["Priya S.","saved profile link for Marco Lopez","Yesterday"],["Rahul K.","closed job “Store Manager”","2 days ago"]],
stages:["New","Screening","Interview","Offer","Placed"]};
const G=k=>EMPTY?[]:D[k];
const NAV=[["dashboard","▦","Dashboard"],["leads","◎","Leads"],["candidates","☺","Candidates"],["import","⇅","Import / Export"],["clients","▣","Clients"],["jobs","✦","Jobs"],["pipeline","≡","Pipeline"],["tasks","✓","Tasks"],["notes","✎","Notes"],["profile","⛓","Profile Links"],["_","", "Admin"],["team","☷","Team & Roles"],["activity","◷","Activity Log"],["settings","⚙","Settings"]];
const ini=n=>n.split(/\s+/).map(w=>w[0]).join('').slice(0,2);
const soonBtn=(t,c='btn')=>`<button class="${c}" onclick="soon('${t}')">${t} <span class="soon">Soon</span></button>`;
function soon(x){const t=$('#toast');t.textContent=x+' is coming soon — visual preview only.';t.classList.add('show');clearTimeout(soon.t);soon.t=setTimeout(()=>t.classList.remove('show'),2200)}
function toggleTheme(){const r=document.documentElement,d=matchMedia('(prefers-color-scheme:dark)').matches;const cur=r.dataset.theme||(d?'dark':'light');r.dataset.theme=cur==='dark'?'light':'dark'}
function empty(i,t,m,btn){return `<div class="empty"><big>${i}</big><h3>${t}</h3><p>${m}</p>${btn||''}</div>`}
function head(t,s,btn){return `<div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start"><div><h1>${t}</h1><p class="sub">${s}</p></div><div>${btn||''}</div></div>`}
function table(cols,rows,fn,emp){if(!rows.length)return `<div class="card">${emp}</div>`;return `<div class="card tbl"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}<th></th></tr></thead><tbody>${rows.map(fn).join('')}</tbody></table></div>`}
const st={Hot:'bad',Warm:'or',New:'',Active:'ok',Prospect:'or','On hold':'',Open:'ok','Offer stage':'or',Draft:'',Interview:'or',Offer:'or',Placed:'ok',Screening:''};
const pill=s=>`<span class="pill ${st[s]||''}">${esc(s)}</span>`;
const who=n=>`<span class="av">${ini(n)}</span>${esc(n)}`;
const act=t=>`<button class="btn ghost" onclick="soon('${t}')">${t}</button>`;
const filt=(ph)=>`<div class="tools"><input placeholder="${ph}" onfocus="soon('Search & filters')"><select onchange="soon('Filters')"><option>All statuses</option></select>${soonBtn('Export CSV','btn ghost')}</div>`;
const V={
dashboard(){const c=G('cands'),l=G('leads');const kp=[["Active leads",l.length,"+12%"],["Candidates",c.length,"+8%"],["Open jobs",G('jobs').filter(j=>j[3]=='Open').length,"+2"],["Placements (MTD)",EMPTY?0:c.filter(x=>x[3]=='Placed').length+3,"+25%"]];
return head('Good morning, Krupal 👋','Here’s what’s happening across Nexora today.',soonBtn('Quick add'))+`<div class="grid g4">${kp.map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b><span class="up">${EMPTY?'—':'▲ '+k[2]}</span></div>`).join('')}</div>
<div class="grid g2" style="margin-top:14px"><div class="card"><b>Pipeline snapshot</b><div style="margin-top:12px">${D.stages.map((s,i)=>{const n=EMPTY?0:c.filter(x=>x[3]==s).length;return `<div class="row"><span style="width:90px">${s}</span><div class="bar" style="flex:1"><i style="width:${n*30}%"></i></div><b>${n}</b></div>`}).join('')}</div></div>
<div class="card"><b>Today’s tasks</b>${G('tasks').slice(0,4).map(t=>`<div class="row"><span>${esc(t[0])}</span>${pill(t[1])}</div>`).join('')||empty('🎉','All clear','No tasks due today.')}</div>
<div class="card"><b>Recent activity</b>${G('log').slice(0,4).map(a=>`<div class="row"><span>${who(a[0])} ${esc(a[1])}</span><small style="color:var(--mu)">${a[2]}</small></div>`).join('')||empty('◷','No activity yet','Actions will appear here.')}</div>
<div class="card"><b>Placements trend</b><svg viewBox="0 0 300 110" width="100%" style="margin-top:10px"><polyline fill="none" stroke="#F58220" stroke-width="3" points="${EMPTY?'0,100 300,100':'0,90 50,75 100,80 150,50 200,55 250,30 300,18'}"/><polyline fill="none" stroke="var(--bd)" points="0,105 300,105"/></svg></div></div>`},
leads(){return head('Leads','Track prospects before they become clients.',soonBtn('+ New lead'))+filt('Search leads…')+table(['Contact','Company','Source','Temp','Owner','Value'],G('leads'),r=>`<tr><td>${who(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${pill(r[3])}</td><td>${r[4]}</td><td>${r[5]}</td><td>${act('Convert')}</td></tr>`,empty('◎','No leads yet','Add your first lead or import a CSV.',soonBtn('+ New lead')))},
candidates(){return head('Candidates','Your talent database.',`<a class="btn navy" style="text-decoration:none" href="#import">⇅ Import / Export</a> `+soonBtn('+ Add candidate'))+filt('Search by name, skill, city…')+table(['Name','Role','Location','Stage','Exp.'],G('cands'),r=>`<tr><td>${who(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${pill(r[3])}</td><td>${r[4]}</td><td>${act('Open')}</td></tr>`,empty('☺','No candidates','Add candidates manually or import a CSV. Resume parsing is coming soon.',soonBtn('+ Add candidate')))},
clients(){return head('Clients','Companies you hire for.',soonBtn('+ New client'))+table(['Client','Industry','Status','Open jobs','Account owner'],G('clients'),r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${pill(r[2])}</td><td>${r[3]}</td><td>${who(r[4])}</td><td>${act('View')}</td></tr>`,empty('▣','No clients yet','Convert a lead or add a client.',soonBtn('+ New client')))},
jobs(){return head('Jobs','Open requisitions and mandates.',soonBtn('+ Post job'))+table(['Title','Client','Location','Status','Applicants'],G('jobs'),r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${pill(r[3])}</td><td>${r[4]}</td><td>${act('Match')}</td></tr>`,empty('✦','No jobs','Create a job to start matching candidates.',soonBtn('+ Post job')))},
pipeline(){const c=G('cands');return head('Pipeline','Drag candidates between stages (preview only — not saved).',soonBtn('Customize stages'))+(c.length?`<div class="kan">${D.stages.map(s=>`<div class="col" data-s="${s}" ondragover="event.preventDefault();this.classList.add('over')" ondragleave="this.classList.remove('over')" ondrop="drop(event,this)"><h4>${s}<span class="pill">${c.filter(x=>x[3]==s).length}</span></h4>${c.filter(x=>x[3]==s).map(x=>`<div class="kc" draggable="true" ondragstart="event.dataTransfer.setData('t',this.dataset.n)" data-n="${esc(x[0])}"><b>${esc(x[0])}</b><br><small>${esc(x[1])}</small></div>`).join('')}</div>`).join('')}</div>`:`<div class="card">${empty('≡','Pipeline is empty','Add candidates to see them here.')}</div>`)},
tasks(){const t=G('tasks');return head('Tasks','Follow-ups and reminders.',soonBtn('+ New task'))+`<div class="card">${t.map((x,i)=>`<label class="row sw"><span><input type="checkbox" ${x[3]?'checked':''} onchange="soon('Saving tasks')"> ${esc(x[0])}</span><span>${pill(x[1])} ${pill(x[2])}</span></label>`).join('')||empty('✓','No tasks','You’re all caught up.',soonBtn('+ New task'))}</div>`},
notes(){return head('Notes','Context attached to people and companies.',soonBtn('+ Add note'))+(G('notes').map(n=>`<div class="card note" style="margin-bottom:12px"><b>${esc(n[0])}</b><p>${esc(n[1])}</p><small style="color:var(--mu)">${n[2]} · ${n[3]}</small></div>`).join('')||`<div class="card">${empty('✎','No notes','Notes you add to records show up here.')}</div>`)},
profile(){return head('Profile Links','Save a public profile URL and preview it safely. Nexora never scrapes or fetches the page.')+`<div class="grid g2"><div class="card"><b>Add profile link</b><p class="sub" style="margin-top:6px">Paste a URL (LinkedIn, GitHub, portfolio…). Only https links are accepted.</p>
<input id="pu" placeholder="https://www.linkedin.com/in/username" style="margin-bottom:8px"><input id="pn" placeholder="Display name (typed by you)" style="margin-bottom:8px"><input id="pr" placeholder="Headline / role (typed by you)" style="margin-bottom:12px">
<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="prev()">Save &amp; preview</button>${soonBtn('Attach to record','btn ghost')}</div><p id="pe" style="color:var(--bad);margin:8px 0 0"></p></div>
<div class="card" id="pc">${empty('⛓','No link previewed','Enter a URL to see the safe preview card.')}</div></div>
<div class="card" style="margin-top:14px"><b>How this stays safe</b><div class="row"><span>No scraping or automated fetching</span>${pill('Guaranteed')}</div><div class="row"><span>Only http/https URLs; links open in a new tab with noopener</span>${pill('Guaranteed')}</div><div class="row"><span>Name &amp; headline are entered manually</span>${pill('Manual')}</div><div class="row"><span>Auto-import of profile data</span>${pill('Not planned')}</div></div>`},
team(){return head('Team & Roles','Control who can see and change what.',soonBtn('Invite member'))+table(['Member','Role','Access'],G('team'),r=>`<tr><td>${who(r[0])}</td><td><select onchange="soon('Role changes')"><option>${r[1]}</option></select></td><td>${r[2]}</td><td>${act('Manage')}</td></tr>`,empty('☷','No team yet','Invite colleagues.'))+`<div class="card" style="margin-top:14px"><b>Roles overview</b><div class="grid g4" style="margin-top:10px">${[["Admin","Everything incl. billing"],["Recruiter","Candidates, jobs, tasks"],["Account Manager","Clients & leads"],["Viewer","Read-only"]].map(r=>`<div class="card"><b>${r[0]}</b><p style="color:var(--mu);margin:6px 0 0">${r[1]}</p></div>`).join('')}</div></div>`},
activity(){return head('Activity & Audit Log','Who did what, and when.',soonBtn('Export log','btn ghost'))+`<div class="card">${G('log').map(a=>`<div class="row"><span>${who(a[0])} ${esc(a[1])}</span><small style="color:var(--mu)">${a[2]}</small></div>`).join('')||empty('◷','No activity yet','Every create, edit and delete will be recorded here.')}</div>`},
settings(){return head('Settings','Workspace preferences.')+`<div class="grid g2"><div class="card"><b>Workspace</b><p></p><input value="Nexora Recruitment" style="margin-bottom:8px"><select style="margin-bottom:12px"><option>Asia/Kolkata (IST)</option></select><button class="btn" onclick="soon('Saving settings')">Save</button></div>
<div class="card"><b>Prototype controls</b><label class="sw row"><span>Show empty states</span><input type="checkbox" ${EMPTY?'checked':''} onchange="EMPTY=this.checked;go()"></label><label class="sw row"><span>Dark / light</span><button class="btn ghost" onclick="toggleTheme()">Toggle</button></label></div>
<div class="card"><b>Integrations</b>${[["Database","Not connected"],["Email sync","Coming soon"],["Calendar","Coming soon"],["Resume parsing","Coming soon"]].map(i=>`<div class="row"><span>${i[0]}</span>${pill(i[1])}</div>`).join('')}</div>
<div class="card ro"><b>Billing</b><p style="color:var(--mu)">Plans and invoices <span class="soon">Soon</span></p></div></div>`}};
D.cands.forEach((c,i)=>{c[5]=c[0].toLowerCase().replace(' ','.')+'@example.com';c[6]='+91 98765 4'+(1000+i);c[7]='';c[8]='Sample'});
const F=[['name','Full name',['name','full name','candidate','candidate name'],0],['role','Role / Title',['role','title','job title','position','designation'],1],['loc','Location',['location','city','address'],2],['stage','Stage',['stage','status','pipeline stage'],3],['exp','Experience',['experience','exp','years'],4],['email','Email',['email','e-mail','email address'],5],['phone','Phone',['phone','mobile','contact','phone number'],6],['url','Profile URL',['profile','profile url','linkedin','link','url'],7],['src','Source',['source','lead source'],8]];
const IM={tab:'import',step:1,file:'',hdr:[],rows:[],map:{},dup:'skip',stage:'New',res:null,sel:F.map(f=>f[0]),fmt:'xlsx'};
const rr=()=>{$('#view').innerHTML=V.import()};
function say(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(say.t);say.t=setTimeout(()=>t.classList.remove('show'),2600)}
async function dl(name,data){const d=window.claude&&await claude.use('downloads');if(!d){say('Downloads work on the published page inside claude.ai.');return}try{await d.save({filename:name,data});say('Saved '+name)}catch(e){if(e&&e.code!=='declined')say('Download unavailable here.')}}
function book(rows){const ws=XLSX.utils.aoa_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Candidates');return[ws,wb]}
function tpl(){const[,wb]=book([F.map(f=>f[1]),['Jane Doe','Data Analyst','Remote','New','4 yrs','jane.doe@example.com','+91 90000 00000','https://www.linkedin.com/in/jane-doe','Referral']]);dl('nexora-candidate-import-template.xlsx',XLSX.write(wb,{type:'array',bookType:'xlsx'}))}
function exp(){const f=F.filter(x=>IM.sel.includes(x[0]));if(!f.length){say('Select at least one field.');return}const[ws,wb]=book([f.map(x=>x[1]),...G('cands').map(c=>f.map(x=>c[x[3]]||''))]);dl('nexora-candidates.'+IM.fmt,IM.fmt=='csv'?XLSX.utils.sheet_to_csv(ws):XLSX.write(wb,{type:'array',bookType:'xlsx'}));D.log.unshift(['Krupal P.','exported candidates to '+IM.fmt.toUpperCase(),'Just now'])}
function onFile(e){const f=e.target.files[0];if(!f)return;if(f.size>5e6){say('File too large (max 5 MB).');return}const r=new FileReader();r.onload=()=>{try{const wb=XLSX.read(r.result,{type:'array'});const a=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:'',blankrows:false});if(a.length<2)throw 0;IM.hdr=a[0].map(String);IM.rows=a.slice(1,2001);IM.file=f.name;IM.map={};F.forEach(x=>{IM.map[x[0]]=IM.hdr.findIndex(h=>x[2].includes(h.trim().toLowerCase()))});IM.step=2;rr()}catch{say('Could not read that file. Use .xlsx, .xls or .csv with a header row.')}};r.readAsArrayBuffer(f)}
function build(){const o={ok:[],dup:[],bad:[]};const seen=new Set(G('cands').map(c=>(c[5]||'').toLowerCase()).filter(Boolean));IM.rows.forEach((r,n)=>{const c=[];F.forEach(f=>{const i=IM.map[f[0]];c[f[3]]=i>=0?String(r[i]).trim():''});if(!c[0]){o.bad.push([n+2,'Missing name']);return}if(c[7]){try{if(new URL(c[7]).protocol!=='https:')throw 0}catch{o.bad.push([n+2,'Profile URL must be a valid https link']);return}}if(!D.stages.includes(c[3]))c[3]=IM.stage;const e=c[5].toLowerCase();if(e&&seen.has(e)){o.dup.push([n+2,c]);return}if(e)seen.add(e);o.ok.push(c)});return o}
function run(){const b=build();let add=b.ok.length,upd=0,skip=0;EMPTY=false;D.cands.push(...b.ok);if(IM.dup=='update')b.dup.forEach(([n,c])=>{const t=D.cands.find(x=>(x[5]||'').toLowerCase()==c[5].toLowerCase());if(t){c.forEach((v,i)=>{if(v)t[i]=v});upd++}});else if(IM.dup=='allow'){D.cands.push(...b.dup.map(d=>d[1]));add+=b.dup.length}else skip=b.dup.length;D.log.unshift(['Krupal P.','imported '+add+' candidates from '+IM.file,'Just now']);IM.res={add,upd,skip,bad:b.bad};IM.step=4;rr()}
function reset(){IM.step=1;IM.file='';IM.res=null;rr()}
V.import=()=>{const T=IM.tab,S=IM.step;const tabs=`<div class="tabs">${[['import','Import'],['export','Export'],['history','History']].map(t=>`<button class="${T==t[0]?'on':''}" onclick="IM.tab='${t[0]}';rr()">${t[1]}</button>`).join('')}</div>`;let h=head('Import / Export Candidates','Move candidate details in and out with Excel or CSV sheets — same flow as Bitrix24: upload, map fields, check duplicates, import.',`<button class="btn ghost" onclick="tpl()">⬇ Download template</button>`)+tabs;
if(T=='import'){h+=`<div class="steps">${['Upload','Map fields','Review','Done'].map((s,i)=>`<span class="${S==i+1?'on':S>i+1?'dn':''}">${i+1}. ${s}</span>`).join('')}</div>`;
if(S==1)h+=`<label class="card drop"><input type="file" accept=".xlsx,.xls,.csv" hidden onchange="onFile(event)"><big style="font-size:34px">📄</big><h3 style="margin:8px 0 4px">Choose an Excel or CSV file</h3><p style="color:var(--mu);margin:0">.xlsx, .xls or .csv · first row = column headers · up to 2,000 rows · processed in your browser</p></label><div class="card" style="margin-top:14px"><b>Sources</b><div class="row"><span>Excel / CSV file (including a Bitrix24 export)</span>${pill('Available')}</div><div class="row"><span>Connect Bitrix24 directly</span>${pill('Coming soon')}</div><div class="row"><span>Google Sheets</span>${pill('Coming soon')}</div><div class="row"><span>Bulk resume upload with parsing</span>${pill('Coming soon')}</div></div>`;
if(S==2)h+=`<div class="card tbl"><b>Map columns from “${esc(IM.file)}” (${IM.rows.length} rows)</b><p class="sub" style="margin-top:4px">We matched what we could automatically. Full name is required.</p><table><thead><tr><th>Nexora field</th><th>Column in your file</th><th>Sample</th></tr></thead><tbody>${F.map(f=>{const i=IM.map[f[0]];return `<tr><td><b>${f[1]}</b>${f[0]=='name'?' *':''}</td><td><select onchange="IM.map['${f[0]}']=+this.value;rr()"><option value="-1">— Don’t import —</option>${IM.hdr.map((x,j)=>`<option value="${j}" ${i==j?'selected':''}>${esc(x||'Column '+(j+1))}</option>`).join('')}</select></td><td style="color:var(--mu)">${i>=0?esc(IM.rows[0][i]):'—'}</td></tr>`}).join('')}</tbody></table></div><div class="tools" style="margin-top:14px"><button class="btn ghost" onclick="reset()">Back</button><button class="btn" ${IM.map.name<0?'disabled style="opacity:.5"':''} onclick="IM.step=3;rr()">Next: review</button></div>`;
if(S==3){const b=build();h+=`<div class="grid g4"><div class="card kpi"><span>Ready to import</span><b>${b.ok.length}</b></div><div class="card kpi"><span>Duplicates (by email)</span><b>${b.dup.length}</b></div><div class="card kpi"><span>Rows with errors</span><b>${b.bad.length}</b></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><b>Options</b><p style="margin:10px 0 4px;color:var(--mu)">If a candidate already exists</p><select onchange="IM.dup=this.value;rr()"><option value="skip" ${IM.dup=='skip'?'selected':''}>Skip duplicates</option><option value="update" ${IM.dup=='update'?'selected':''}>Update existing record</option><option value="allow" ${IM.dup=='allow'?'selected':''}>Import anyway</option></select><p style="margin:10px 0 4px;color:var(--mu)">Default pipeline stage</p><select onchange="IM.stage=this.value;rr()">${D.stages.map(s=>`<option ${IM.stage==s?'selected':''}>${s}</option>`).join('')}</select><p style="margin:10px 0 4px;color:var(--mu)">Assign to recruiter</p><select onchange="soon('Assigning owners')"><option>Me (Krupal P.)</option></select></div><div class="card tbl"><b>Preview (first 5)</b><table><thead><tr><th>Name</th><th>Role</th><th>Email</th><th>Stage</th></tr></thead><tbody>${b.ok.slice(0,5).map(c=>`<tr><td>${esc(c[0])}</td><td>${esc(c[1])}</td><td>${esc(c[5])}</td><td>${pill(c[3])}</td></tr>`).join('')||'<tr><td colspan=4>No valid rows.</td></tr>'}</tbody></table></div></div>${b.bad.length?`<div class="card" style="margin-top:14px"><b>Rows that will be skipped</b>${b.bad.slice(0,6).map(x=>`<div class="row"><span>Row ${x[0]}</span><span class="pill bad">${x[1]}</span></div>`).join('')}</div>`:''}<div class="tools" style="margin-top:14px"><button class="btn ghost" onclick="IM.step=2;rr()">Back</button><button class="btn" onclick="run()">Import candidates</button></div>`}
if(S==4){const r=IM.res;h+=`<div class="grid g4"><div class="card kpi"><span>Added</span><b>${r.add}</b></div><div class="card kpi"><span>Updated</span><b>${r.upd}</b></div><div class="card kpi"><span>Skipped duplicates</span><b>${r.skip}</b></div><div class="card kpi"><span>Errors</span><b>${r.bad.length}</b></div></div><div class="tools" style="margin-top:14px"><a class="btn" style="text-decoration:none" href="#candidates">View candidates</a><button class="btn ghost" onclick="reset()">Import another file</button></div><p class="sub">Prototype note: imported rows live in this browser session only until a database is connected.</p>`}}
if(T=='export'){const n=G('cands').length;h+=`<div class="grid g2"><div class="card"><b>Fields to include</b>${F.map(f=>`<label class="chk"><input type="checkbox" ${IM.sel.includes(f[0])?'checked':''} onchange="this.checked?IM.sel.push('${f[0]}'):IM.sel=IM.sel.filter(k=>k!='${f[0]}');rr()">${f[1]}</label>`).join('')}</div><div class="card"><b>Export settings</b><p style="margin:10px 0 4px;color:var(--mu)">Format</p><select onchange="IM.fmt=this.value;rr()"><option value="xlsx" ${IM.fmt=='xlsx'?'selected':''}>Excel (.xlsx)</option><option value="csv" ${IM.fmt=='csv'?'selected':''}>CSV (.csv)</option></select><p style="margin:10px 0 4px;color:var(--mu)\">Which candidates</p><select><option>All candidates (${n})</option></select><div class="tools" style="margin:12px 0 0">${soonBtn('Export filtered / selected','btn ghost')}${soonBtn('Scheduled export','btn ghost')}</div><button class="btn" style="margin-top:14px;width:100%" ${n?'':'disabled'} onclick="exp()">⬇ Export ${n} candidates</button></div></div>${n?'':`<div class="card" style="margin-top:14px">${empty('☺','Nothing to export','Import or add candidates first.')}</div>`}`}
if(T=='history'){const H=EMPTY?[]:[['Import','candidates_march.xlsx','42 added · 3 skipped','Krupal P.','Today'],['Export','nexora-candidates.xlsx','128 rows','Priya S.','Yesterday'],['Import','bitrix24_export.csv','65 added · 9 updated','Rahul K.','3 days ago']];h+=table(['Type','File','Result','By','When'],H,r=>`<tr><td>${pill(r[0])}</td><td>${r[1]}</td><td>${r[2]}</td><td>${who(r[3])}</td><td>${r[4]}</td><td>${act('Undo')}</td></tr>`,empty('⇅','No history yet','Imports and exports will be listed here.'))}
return h};
function prev(){const u=$('#pu').value.trim(),e=$('#pe');e.textContent='';let x;try{x=new URL(u);if(x.protocol!=='https:')throw 0}catch{e.textContent='Please enter a valid https:// URL.';return}
const n=$('#pn').value.trim()||'Unnamed profile',r=$('#pr').value.trim()||'No headline added';const h=x.hostname.replace(/^www\./,'');
$('#pc').innerHTML=`<b>Preview</b><div class="pv" style="margin-top:12px"><div class="big">${esc(ini(n))}</div><div><b>${esc(n)}</b><br><span style="color:var(--mu)">${esc(r)}</span><br><span class="pill" style="margin-top:6px">${esc(h)}</span></div></div><p style="word-break:break-all;color:var(--mu)">${esc(x.href)}</p><div style="display:flex;gap:8px;flex-wrap:wrap"><a class="btn" style="text-decoration:none" href="${esc(x.href)}" target="_blank" rel="noopener noreferrer nofollow">Open in new tab ↗</a>${soonBtn('Copy link','btn ghost')}</div><p style="font-size:12px;color:var(--mu)">Details above were typed by you. Nexora did not fetch this page.</p>`}
function drop(ev,col){ev.preventDefault();col.classList.remove('over');const n=ev.dataTransfer.getData('t'),c=D.cands.find(x=>x[0]===n);if(c){c[3]=col.dataset.s;go()}}
function go(){const k=(location.hash||'#dashboard').slice(1);const v=V[k]?k:'dashboard';
$('#nav').innerHTML=NAV.map(n=>n[0]=='_'?`<small>${n[2]}</small>`:`<a class="${n[0]==v?'on':''}" href="#${n[0]}"><span>${n[1]}</span>${n[2]}</a>`).join('');
$('#view').innerHTML=V[v]();side.classList.remove('open');scrollTo(0,0)}
addEventListener('hashchange',go);go();
</script></body></html>
